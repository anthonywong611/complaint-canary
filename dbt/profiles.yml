# No credentials live here. BigQuery targets use Application Default Credentials.
complaint_canary:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('CANARY_DUCKDB_PATH', '../data/warehouse.duckdb') }}"
      schema: main
      threads: 1
    dev: &bigquery
      type: bigquery
      method: oauth
      project: "{{ env_var('CANARY_GCP_PROJECT', 'unset') }}"
      dataset: "{{ env_var('CANARY_DATASET_PREFIX', '') }}staging"
      location: "{{ env_var('CANARY_BQ_LOCATION', 'US') }}"
      threads: 4
      priority: interactive
      job_execution_timeout_seconds: 1800
      job_retries: 1
      maximum_bytes_billed: 53687091200
    qa: *bigquery
    prod: *bigquery
